name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instantiate
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        env:
          DEEP_LITTRE_REQUIRE_VALIDATOR: '1'
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Validate the Lex-0 probe
        run: julia --project=. test/validate_probe.jl

      - name: Build and validate the development corpus
        run: |
          julia --project=. bin/run_pipeline.jl test/corpus/source /tmp/out --patches none --store test/corpus/adjudication --strict-adjudications --build-manifest /tmp/out/BUILD-MANIFEST.toml
          test -s /tmp/out/BUILD-MANIFEST.toml
          grep -Eq '^patched_source_sha256 = "[0-9a-f]{64}"$' /tmp/out/BUILD-MANIFEST.toml
          julia --project=. bin/validate_lex0.jl /tmp/out/littre.tei.xml
