# Littré usage label -> (usg type, norm). Consumed by route_atom in norms.jl.
#
# Evaluation order is fixed and load-bearing: exact -> prefix -> lemma ->
# domain_prefix -> hint. exact must precede domain_prefix so that "terme
# familier" reaches socioCultural rather than being swallowed by the "terme"
# domain rule; lemma must precede domain_prefix for the same reason with
# "terme vieilli" (temporal) and "terme peu usité" (frequency). Those three
# atoms are pinned by tests in test/norms_ordering.jl.
#
# Format note: the ordered tiers are arrays of tables rather than the plain
# tables of the pass-1 artifact, because Julia's TOML parser returns unordered
# dicts and the tier order above must not be an implementation accident. The
# semantics are unchanged; scripts/sampling/build_sampling_artifacts.py needs
# the matching reader change if it is re-run.
#
# Provenance:
#   - Rows without a marker are the sampling pass 1 calibration (2026-07-18),
#     measured over 4,242 <usg type="register"> occurrences / 4,482 atoms.
#   - Rows marked "W2" are post-calibration additions (2026-07-19) made when
#     this table was extended to serve the <usg type="sem"> population
#     (22,831 occurrences, 1,747 distinct), which pass 1 never sampled. The
#     pass-1 artifact test/sampling/register_labels_full.tsv is unchanged; the
#     register residue moves from 69 to 59 atoms as a result of these rows.

[exact]
"antiphrase" = ["meaningType", "byAntiphrasis"]
"bassement" = ["socioCultural", "low"]
"burlesquement" = ["textType", "burlesque"]
"ce mot est familier" = ["socioCultural", "familiar"]
"dans le langage familier" = ["socioCultural", "familiar"]
"elliptiquement" = ["meaningType", "elliptical"]
"en plaisantant" = ["attitude", "jocular"]
"familier" = ["socioCultural", "familiar"]
"familièrement" = ["socioCultural", "familiar"]
"fig" = ["meaningType", "figurative"]
"figuré" = ["meaningType", "figurative"]
"figurément" = ["meaningType", "figurative"]
"il est familier" = ["socioCultural", "familiar"]
"ironie" = ["attitude", "ironic"]
"ironiquement" = ["attitude", "ironic"]
"mot bas" = ["socioCultural", "low"]
"mot familier" = ["socioCultural", "familiar"]
"mot populaire" = ["socioCultural", "popular"]
"néologisme" = ["temporal", "neologism"]
"plaisamment" = ["attitude", "jocular"]
"plaisanterie" = ["attitude", "jocular"]
"populaire" = ["socioCultural", "popular"]
"populairement" = ["socioCultural", "popular"]
"poétiquement" = ["textType", "poetic"]
"terme familier" = ["socioCultural", "familiar"]
"terme populaire" = ["socioCultural", "popular"]
"trivialement" = ["socioCultural", "vulgar"]
"vulgairement" = ["socioCultural", "vulgar"]
# W2 additions
"anciennement" = ["temporal", "archaic"]
"abusivement" = ["normativity", "improper"]
"en bonne part" = ["attitude", "appreciative"]
"en mauvaise part" = ["attitude", "derogatory"]
"famil" = ["socioCultural", "familiar"]
"latinisme" = ["hint", "latinism"]
"particulièrement" = ["meaningType", "particular"]
"poétique" = ["textType", "poetic"]
"terme bas" = ["socioCultural", "low"]
"terme de dénigrement" = ["attitude", "derogatory"]
"terme de mépris" = ["attitude", "derogatory"]
"terme grossier" = ["socioCultural", "vulgar"]
"très familièrement" = ["socioCultural", "familiar"]

# W2 additions, placed ahead of the pass-1 prefixes because several are
# longer forms sharing their leading token ("par une autre extension").
[[prefix]]
pattern = "par abus"
type = "normativity"
norm = "improper"

[[prefix]]
pattern = "par une autre extension"
type = "meaningType"
norm = "byExtension"

[[prefix]]
pattern = "par une autre figure"
type = "meaningType"
norm = "figurative"

[[prefix]]
pattern = "par antonomase"
type = "meaningType"
norm = "antonomasia"

[[prefix]]
pattern = "par assimilation"
type = "meaningType"
norm = "byAnalogy"

[[prefix]]
pattern = "par catachr[èe]se"
type = "meaningType"
norm = "catachresis"

[[prefix]]
pattern = "par m[ée]tonymie"
type = "meaningType"
norm = "metonymic"

[[prefix]]
pattern = "par opposition"
type = "meaningType"
norm = "byOpposition"

[[prefix]]
pattern = "par abr[ée]viation"
type = "meaningType"
norm = "elliptical"

[[prefix]]
pattern = "par (moquerie|raillerie|impr[ée]cation|exclamation)"
type = "attitude"
norm = "jocular"

[[prefix]]
pattern = "par (civilit[ée]|politesse|respect)"
type = "attitude"
norm = "polite"

# pass-1 prefixes
[[prefix]]
pattern = "par extension"
type = "meaningType"
norm = "byExtension"

[[prefix]]
pattern = "par analogie"
type = "meaningType"
norm = "byAnalogy"

[[prefix]]
pattern = "par exag[ée]ration"
type = "meaningType"
norm = "hyperbole"

[[prefix]]
pattern = "par m[ée]taphore"
type = "meaningType"
norm = "metaphorical"

[[prefix]]
pattern = "par antiphrase"
type = "meaningType"
norm = "byAntiphrasis"

[[prefix]]
pattern = "par ellipse"
type = "meaningType"
norm = "elliptical"

[[prefix]]
pattern = "par pl[ée]onasme"
type = "meaningType"
norm = "pleonasm"

[[prefix]]
pattern = "par ironie"
type = "attitude"
norm = "ironic"

[[prefix]]
pattern = "par plaisanterie"
type = "attitude"
norm = "jocular"

[[prefix]]
pattern = "par (d[ée]rision|d[ée]nigrement|d[ée]pr[ée]ciation|m[ée]pris|menace)"
type = "attitude"
norm = "derogatory"

[[prefix]]
pattern = "dans le langage (de|des|du)\\b"
type = "socioCultural"
norm = "slang"

[[prefix]]
pattern = "mot populaire"
type = "socioCultural"
norm = "popular"

[[lemma]]
pattern = "(vieux|vieilli|a vieilli|vieillit)"
type = "temporal"
norm = "archaic"

[[lemma]]
pattern = "(hors d'usage|d[ée]su[ée]tude|n'est plus usit|ne s'emploie plus)"
type = "temporal"
norm = "obsolete"

[[lemma]]
pattern = "(peu usit|inusit|rare)"
type = "frequency"
norm = "rare"

[[lemma]]
pattern = "(mauvais langage|barbare|\\blibre\\b)"
type = "normativity"
norm = "proscribed"

# W2 tier. Littré's "terme de X" / "en termes de X" / "de X" constructions are
# domain labels of the same species as the 35,099 already emitted as
# <usg type="domain">. This tier runs last so the exact and lemma rows above
# keep "terme familier", "terme vieilli" and "terme peu usité".
[[domain_prefix]]
pattern = "en termes? d"
type = "domain"
norm = ""

[[domain_prefix]]
pattern = "terme"
type = "domain"
norm = ""

[[domain_prefix]]
pattern = "d[eu']"
type = "domain"
norm = ""

[[lemma]]
pattern = "terme familier"
type = "socioCultural"
norm = "familiar"
