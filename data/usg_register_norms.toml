# register-label -> (usg type, norm). Consumed by W2 <usg> remap.
# normalize (lowercase, strip trailing .,;:) -> split compounds on ' et '
# -> exact atom, else prefix rule, else lemma regex, else hint.

[exact]
"antiphrase" = ["meaningType", "byAntiphrasis"]
"bassement" = ["socioCultural", "low"]
"burlesquement" = ["textType", "burlesque"]
"ce mot est familier" = ["socioCultural", "familiar"]
"dans le langage familier" = ["socioCultural", "familiar"]
"elliptiquement" = ["meaningType", "elliptical"]
"en plaisantant" = ["attitude", "jocular"]
"familier" = ["socioCultural", "familiar"]
"familièrement" = ["socioCultural", "familiar"]
"fig" = ["meaningType", "figurative"]
"figuré" = ["meaningType", "figurative"]
"figurément" = ["meaningType", "figurative"]
"il est familier" = ["socioCultural", "familiar"]
"ironie" = ["attitude", "ironic"]
"ironiquement" = ["attitude", "ironic"]
"mot bas" = ["socioCultural", "low"]
"mot familier" = ["socioCultural", "familiar"]
"mot populaire" = ["socioCultural", "popular"]
"néologisme" = ["temporal", "neologism"]
"plaisamment" = ["attitude", "jocular"]
"plaisanterie" = ["attitude", "jocular"]
"populaire" = ["socioCultural", "popular"]
"populairement" = ["socioCultural", "popular"]
"poétiquement" = ["textType", "poetic"]
"terme familier" = ["socioCultural", "familiar"]
"terme populaire" = ["socioCultural", "popular"]
"trivialement" = ["socioCultural", "vulgar"]
"vulgairement" = ["socioCultural", "vulgar"]

[prefix]
"par extension" = ["meaningType", "byExtension"]
"par analogie" = ["meaningType", "byAnalogy"]
"par exag[ée]ration" = ["meaningType", "hyperbole"]
"par m[ée]taphore" = ["meaningType", "metaphorical"]
"par antiphrase" = ["meaningType", "byAntiphrasis"]
"par ellipse" = ["meaningType", "elliptical"]
"par pl[ée]onasme" = ["meaningType", "pleonasm"]
"par ironie" = ["attitude", "ironic"]
"par plaisanterie" = ["attitude", "jocular"]
"par (d[ée]rision|d[ée]nigrement|d[ée]pr[ée]ciation|m[ée]pris|menace)" = ["attitude", "derogatory"]
"dans le langage (de|des|du)\b" = ["socioCultural", "slang"]
"mot populaire" = ["socioCultural", "popular"]

[lemma]
"(vieux|vieilli|a vieilli|vieillit)" = ["temporal", "archaic"]
"(hors d'usage|d[ée]su[ée]tude|n'est plus usit|ne s'emploie plus)" = ["temporal", "obsolete"]
"(peu usit|inusit|rare)" = ["frequency", "rare"]
"(mauvais langage|barbare|\blibre\b)" = ["normativity", "proscribed"]
