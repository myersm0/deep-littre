# Littré etymology language abbrev -> BCP 47. Consumed by W4 <cit> construction.
# Match the last dot-terminated abbrev before a <foreign>/<mentioned> form in <etym>.
# Amendments per 01_decisions: bas-bret.=br, flam.=nl.
# expand added post-calibration (2026-07-26, W4): French expansion of the printed
# abbreviation, display content only — never consulted for recognition. Omitted
# where no French full form is attestable (cornw.).
# Private-use codes amended 2026-07-27 (W4): RFC 3066/BCP 47 cap subtags at 8
# characters, so full-word x-subtags (bourguignon, berrichon, champenois,
# nivernais, saintongeais) are truncated to well-formed length.

